# Scamazon on jarllindquist.com/scamazon, deployed by .github/workflows/deploy.yml.
# docker-compose.yml is still the local stack (with mongo-express and published ports).
#
# - Only home-page-service is reachable, through Traefik. No ports are published: Docker ports
#   bypass the server's firewall.
# - Two kinds of account: customers sign up and log in with a password and can buy; the admin
#   logs in with the magic link to Telegram (n8n, app "scamazon-admin") and has no password.
# - Passwords come from .env, which the deploy writes from Vault (kv/scamazon); see .env.example.
name: "scamazon"

services:
  # Built from source at a fixed commit: the newer frontend (landing page, CSS in static/) with
  # per-visitor sessions, customer accounts and the magic-link admin (home-page-service#10), and
  # avatars to pick from (#11), and the account page (#12).
  # Never an unpinned one: older versions run with debug=True, let anyone delete products or let
  # anyone sign up as admin.
  home-page-service:
    build:
      context: https://github.com/DevOps22-Grupp1/home-page-service.git#312744d1e33d57e71d0f98a6ca480da943f1ff70:backend
    restart: always
    environment:
      - COOKIE_SECURE=1
      # The public demo account, shown on the login page (user-management-service creates it)
      - DEMO_USERNAME=demo
      - DEMO_PASSWORD=demo
      - SECRET_KEY=${SECRET_KEY:?missing in .env}
      - SERVER_PORT=4004
      - PRODUCT_URL=product-catalog-service
      - PRODUCT_PORT=4005
      - USER_URL=user-management-service
      - USER_PORT=4006
      - ORDER_URL=order-processing-service
      - ORDER_PORT=4007
    networks:
      - my_network
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.scamazon.rule=Host(`jarllindquist.com`) && PathPrefix(`/scamazon`)"
      - "traefik.http.routers.scamazon.entrypoints=websecure"
      - "traefik.http.routers.scamazon.tls.certresolver=myresolver"
      # /scamazon -> /scamazon/, then the prefix off; stripPrefix sets X-Forwarded-Prefix,
      # which the app uses to build its links
      - "traefik.http.routers.scamazon.middlewares=scamazon-slash,scamazon-strip"
      - "traefik.http.middlewares.scamazon-slash.redirectregex.regex=^(https?://[^/]+/scamazon)$$"
      - "traefik.http.middlewares.scamazon-slash.redirectregex.replacement=$${1}/"
      - "traefik.http.middlewares.scamazon-slash.redirectregex.permanent=true"
      - "traefik.http.middlewares.scamazon-strip.stripprefix.prefixes=/scamazon"
      - "traefik.http.services.scamazon.loadbalancer.server.port=4004"

  order-processing-service:
    image: passwordnotsafe/order-processing-service:latest
    restart: always
    networks:
      - my_network
    depends_on:
      mongo-database-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=4007
      - DB_HOST=mongo-database-service
      - DB_PORT=27017
      - DB_USERNAME=root
      - DB_PASSWORD=${MONGO_ROOT_PASSWORD:?missing in .env}

  product-catalog-service:
    image: passwordnotsafe/produkt-catalog-service:latest
    restart: always
    networks:
      - my_network
    depends_on:
      mongo-database-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=4005
      - DB_HOST=mongo-database-service
      - DB_PORT=27017
      - DB_USERNAME=root
      - DB_PASSWORD=${MONGO_ROOT_PASSWORD:?missing in .env}

  # Built from source too: hashed passwords, and sign-up always makes a customer
  # (user-management-service#5), the demo account (#6) and the account page endpoints (#7).
  # The old image stored plaintext
  # passwords and any role sent.
  user-management-service:
    build:
      context: https://github.com/DevOps22-Grupp1/user-management-service.git#0f45506a5d24ad05bf027d6bdbd7579af14893e8:backend
    restart: always
    networks:
      - my_network
    depends_on:
      mongo-database-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=4006
      # A shared customer anyone may use, so the password is no secret; set back on every start
      - DEMO_USERNAME=demo
      - DEMO_PASSWORD=demo
      - DEMO_AVATAR=avatar-4.svg
      - DB_HOST=mongo-database-service
      - DB_PORT=27017
      - DB_USERNAME=root
      - DB_PASSWORD=${MONGO_ROOT_PASSWORD:?missing in .env}

  # One database for all three services. The aliases are the host names the services have used
  # in different versions, so every image finds it.
  mongo-database-service:
    image: mongo:7
    restart: always
    networks:
      my_network:
        aliases:
          - mongo
          - mongo-product-catalog-service
          - mongo-order-processing-service
          - mongo-management-service
    volumes:
      # Seed data on first start only (an empty volume)
      - ./init:/docker-entrypoint-initdb.d:ro
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?missing in .env}
      MONGO_INITDB_DATABASE: allUsers

volumes:
  mongo-data:

networks:
  my_network:
    driver: bridge
  traefik-net:
    external: true
