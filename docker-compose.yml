name: "scamazon"
  
services:
  home-page-service:
    image: passwordnotsafe/home-page-service
    networks:
      - my_network
    ports:
      - "4004:4004"
    environment:
      - SERVER_PORT=4004
      - PRODUCT_URL=product-catalog-service
      - PRODUCT_PORT=4005
      - USER_URL=user-management-service
      - USER_PORT=4006
      - ORDER_URL=order-processing-service
      - ORDER_PORT=4007

  ###################################################################################

  order-processing-service:
    image: passwordnotsafe/order-processing-service
    ports:
      - 4007:4007
    networks:
      - my_network
    depends_on:
      mongo-database-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=4007
      - DB_HOST=mongo-database-service
      - DB_PORT=27017
      - DB_USERNAME=root
      - DB_PASSWORD=example

