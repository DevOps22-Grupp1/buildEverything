  user-management-service:
    image: passwordnotsafe/user-management-service
    ports:
      - 4006:4006
    networks:
      - my_network
    depends_on:
      mongo-database-service:
        condition: service_healthy
    environment:
      - SERVER_PORT=4006
      - DB_USERNAME=root
      - DB_PASSWORD=example
      - DB_HOST=mongo-management-service
      - DB_PORT=27017

  # ##########################################################################################


  mongo-database-service:
    image: mongo
    restart: always
    networks:
      - my_network
    volumes:
      # - ./init/user/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./data-service:/data/db
    healthcheck:
      test: echo 'mongo-database-service.runCommand("ping").ok' | mongosh mongo-database-service:27017 --quiet
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 100s
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
      MONGO_INITDB_DATABASE: allUsers

  mongo-express-management-service:
    image: mongo-express
    restart: always
    ports:
      - 8086:8081
    networks:
      - my_network
    depends_on:
      mongo-database-service:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: example
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo-database-service:27017/

networks:
  my_network:
    driver: bridge
