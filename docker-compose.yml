    networks:
      - my_network
    ports:
      - 4005:4005
    depends_on:
      mongo-database-service:
        condition: service_healthy
    environment:
      - DB_HOST=mongo-database-service
      - DB_USERNAME=root
      - DB_PASSWORD=example
      - DB_PORT=27017
