name: docker-compose-actions-workflow
# Not on the deploy branch: docker-compose v1 is gone from the runners, and the deploy has its own workflow
on:
  push:
    branches-ignore: [deploy/jarllindquist]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Build the stack
        run: docker-compose -f docker-test.yml up  -d
      - name: Check the docker ps
        run: docker logs buildeverything_home-page-service_1