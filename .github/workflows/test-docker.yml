name: docker-compose-actions-workflow
# Smoke test of docker-compose.prod.yml before it reaches the deploy branch: builds the pinned
# home-page-service and user-management-service, starts the whole stack with throwaway passwords
# and checks the pages from inside the container (no ports are published), with the headers
# Traefik sends.
on:
  pull_request:
    branches: [deploy/jarllindquist]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          printf "MONGO_ROOT_PASSWORD='%s'\nSECRET_KEY='%s'\n" "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > .env
          docker network create traefik-net
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml up -d --build --wait --wait-timeout 300

      - name: Run the migrations
        run: |
          for f in migrations/*.js; do
            echo "migration $f"
            docker compose -f docker-compose.prod.yml exec -T mongo-database-service \
              sh -c 'mongosh --quiet -u root -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin' < "$f" | tee -a migration.log
          done
          # Every product the image migration names must exist, and every demo account
          grep -E 'product images: matched ([0-9]+) of \1,' migration.log
          grep -E 'demo accounts: matched ([0-9]+) of \1,' migration.log

      - name: Check the pages and the logins
        run: |
          docker compose -f docker-compose.prod.yml exec -T home-page-service python - <<'EOF'
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          HEADERS = {"X-Forwarded-Prefix": "/scamazon", "X-Forwarded-Proto": "https",
                     "X-Forwarded-Host": "jarllindquist.com", "X-Forwarded-For": "203.0.113.1"}

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          class Visitor:
              """One browser. The cookie is Secure (COOKIE_SECURE=1) and this is plain http inside
              the container, so it is carried by hand instead of by a cookie jar."""

              def __init__(self):
                  self.cookie = ""

              def go(self, path, method="GET", form=None):
                  data = urllib.parse.urlencode(form).encode() if form is not None else None
                  headers = dict(HEADERS, Cookie=self.cookie) if self.cookie else dict(HEADERS)
                  req = urllib.request.Request("http://127.0.0.1:4004" + path, data=data, headers=headers, method=method)
                  try:
                      r = opener.open(req, timeout=10)
                  except urllib.error.HTTPError as e:
                      r = e
                  set_cookie = r.headers.get("Set-Cookie")
                  if set_cookie:
                      self.cookie = set_cookie.split(";", 1)[0]
                  return r.status, r.headers.get("Location", ""), r.read().decode("utf-8", "replace"), set_cookie or ""

          anon = Visitor()

          # The services may still be connecting to the database
          for _ in range(30):
              status, _, body, _ = anon.go("/server/")
              if status == 200 and (body.count("Success") == 3 or body.count('status-card is-up') == 3):
                  break
              time.sleep(2)
          else:
              raise SystemExit("/server/ never showed all three services as Success")

          failures = []
          def expect(ok, message):
              if not ok:
                  failures.append(message)

          for path in ["/home", "/products/", "/products/?page=2", "/about/", "/server/", "/login/", "/admin-login/",
                       "/static/base.css", "/static/modern.css", "/static/images/background2.jpg"]:
              status, _, _, _ = anon.go(path)
              print(path, status)
              expect(status == 200, f"{path}: {status}, expected 200")
          # The new design opens on the shop; the classic one has the fade-in intro (checked below)
          status, location, _, _ = anon.go("/")
          expect(status == 302 and location.endswith("/scamazon/home"), f"/ in the new design: {status} {location}")

          status, _, body, _ = anon.go("/products/")
          expect("/scamazon/static/modern.css" in body, "/products/: stylesheet link without the /scamazon prefix")
          expect("Failed to fetch data" not in body, "/products/: no products from product-catalog-service")
          expect("Grab it" not in body and "Add to cart" not in body, "/products/: a buy button shown to a visitor who is not logged in")
          expect("modern.css" in body, "/products/: not the new design by default")
          # Elgiganten's product images are gone and show a TV for every product
          status, _, body, _ = anon.go("/products/?page=0")
          expect("elgiganten.se" not in body, "/products/?page=0: still links to dead elgiganten.se images")
          status, _, body, _ = anon.go("/login/")
          expect('name="select"' not in body, "/login/: the sign-up form still has a role picker")

          # Nobody logged in: shopping goes to the login, product changes to the admin login
          for method, path, target in [("GET", "/cart/", "/scamazon/login/"), ("GET", "/buy/?id=1", "/scamazon/login/"),
                                       ("GET", "/payment", "/scamazon/login/"),
                                       ("GET", "/admin-product/", "/scamazon/admin-login/"),
                                       ("GET", "/delete/?id=1", "/scamazon/admin-login/"),
                                       ("POST", "/update/", "/scamazon/admin-login/"),
                                       ("POST", "/add_products/", "/scamazon/admin-login/")]:
              status, location, _, _ = anon.go(path, method, {} if method == "POST" else None)
              print(method, path, status, location)
              expect(status == 302 and location.endswith(target), f"{method} {path}: {status} {location}, expected a redirect to {target}")

          # A new customer, who asks for admin on sign-up: gets a customer, can shop, is not admin
          shopper = Visitor()
          status, location, _, set_cookie = shopper.go("/login/", "POST", {
              "sign_up": "Sign Up", "username": "ci-shopper", "name": "CI", "pass": "ci-password",
              "email": "ci@example.com", "avatar": "avatar-5.svg", "select": "admin", "user": "", "password": ""})
          print("sign-up", status, location)
          expect(status == 302 and location.endswith("/scamazon/products/"), f"sign-up: {status} {location}")
          expect("SameSite=Strict" in set_cookie and "Secure" in set_cookie and "HttpOnly" in set_cookie,
                 f"session cookie flags: {set_cookie}")
          status, _, body, _ = shopper.go("/products/")
          expect("Grab it" in body and "ci-shopper" in body, "/products/ as a customer: no buy button or no name")
          expect("/scamazon/static/avatars/avatar-5.svg" in body, "/products/ as a customer: not the picked avatar")
          status, location, _, _ = shopper.go("/buy/?id=1")
          expect(status == 302, f"/buy/ as a customer: {status}")
          status, _, body, _ = shopper.go("/cart/")
          expect(status == 200 and "€" in body, f"/cart/ as a customer: {status}")
          # Prices in kronor (ECB rate, or the fallback if the ECB is unreachable), then pay
          status, location, _, _ = shopper.go("/currency", "POST", {"currency": "SEK", "next": "/cart/"})
          expect(location.endswith("/scamazon/cart/"), f"/currency: {status} {location}")
          status, _, body, _ = shopper.go("/cart/")
          expect(" kr" in body and "converted from euro" in body, "/cart/ in SEK: no kronor or no rate note")
          print("rate note:", [l.strip() for l in body.splitlines() if "converted from euro" in l][:1])
          status, _, body, _ = shopper.go("/payment")
          expect(status == 200, f"/payment: {status}")
          status, _, body, _ = shopper.go("/cart/")
          expect("Remove" not in body and "Pay " not in body, "/cart/ after paying: the cart is not empty")
          # My orders: the order just paid, in kronor
          status, _, body, _ = shopper.go("/orders/")
          expect(status == 200 and "Order #" in body and " kr" in body and "Paid in SEK" in body,
                 f"/orders/: {status}, no order in kronor")
          status, location, _, _ = anon.go("/orders/")
          expect(location.endswith("/scamazon/login/"), f"/orders/ without a login: {status} {location}")

          # A product page, with the robots' reviews; a product that does not exist is a 404
          status, _, body, _ = anon.go("/product/1/")
          expect(status == 200 and 'data-trick="reviews"' in body and "★★★★★" in body, f"/product/1/: {status}")
          status, _, _, _ = anon.go("/product/99999/")
          expect(status == 404, f"/product/99999/: {status}, expected 404")

          # Live status: three services up with a response time, and the deeper checks
          import json as _json
          status, _, body, _ = anon.go("/status.json")
          services = _json.loads(body)["services"] if status == 200 else []
          expect(len(services) == 3 and all(s["up"] and s["ms"] is not None for s in services),
                 f"/status.json: {status} {services}")
          status, _, body, _ = anon.go("/status/checks.json")
          checks = {c["name"]: c for c in _json.loads(body)["checks"]} if status == 200 else {}
          for name in ["Products load", "Accounts answer", "Orders answer"]:
              expect(checks.get(name, {}).get("ok"), f"/status/checks.json: {name}: {checks.get(name)}")
          # The ECB check depends on the ECB answering the runner; reported, not required
          print("rates check:", checks.get("Exchange rates are fresh"))
          status, location, _, _ = anon.go("/admin/")
          expect(location.endswith("/scamazon/admin-login/"), f"/admin/ without the admin: {status} {location}")
          status, location, _, _ = shopper.go("/currency", "POST", {"currency": "EUR", "next": "//evil.example/"})
          expect(location.endswith("/scamazon/products/"), f"/currency to another site: {location}")
          status, location, _, _ = shopper.go("/admin-product/")
          expect(status == 302 and location.endswith("/scamazon/admin-login/"), f"/admin-product/ as a customer: {status} {location}")
          status, location, _, _ = shopper.go("/delete/?id=1")
          expect(status == 302 and location.endswith("/scamazon/admin-login/"), f"/delete/ as a customer: {status} {location}")

          # Logging in again with the password works; a wrong one does not
          again = Visitor()
          again.go("/login/", "POST", {"sign_in": "Sign In", "user": "ci-shopper", "password": "ci-password"})
          expect(again.go("/cart/")[0] == 200, "log in with the new account's password failed")
          wrong = Visitor()
          wrong.go("/login/", "POST", {"sign_in": "Sign In", "user": "ci-shopper", "password": "nope"})
          expect(wrong.go("/cart/")[0] == 302, "a wrong password logged in")

          # The classic design is still whole: a visitor and the shopper switch to it
          classic = Visitor()
          status, location, _, _ = classic.go("/theme", "POST", {"theme": "classic", "next": "/products/"})
          expect(location.endswith("/scamazon/products/"), f"/theme: {status} {location}")
          for path in ["/", "/home", "/products/", "/about/", "/server/", "/login/", "/admin-login/"]:
              status, _, body, _ = classic.go(path)
              expect(status == 200 and "modern.css" not in body, f"{path} in the classic design: {status}")
          status, _, body, _ = classic.go("/products/")
          expect('class="ds-select"' in body and "/scamazon/static/base.css" in body, "/products/ in the classic design: no design picker or no classic CSS")

          # Dark and clean: the modern pages with their own style, and the same picker
          for style in ["dark", "clean", "terminal"]:
              look = Visitor()
              look.go("/theme", "POST", {"theme": style, "next": "/home"})
              for path in ["/home", "/products/", "/login/", "/server/"]:
                  status, _, body, _ = look.go(path)
                  expect(status == 200 and f'data-style="{style}"' in body and body.count('class="ds-select"') == 1,
                         f"{path} in the {style} design: {status}")
          # A customer of its own, so the shopper's cart stays empty for the Mongo check
          fan = Visitor()
          fan.go("/theme", "POST", {"theme": "classic", "next": "/login/"})
          fan.go("/login/", "POST", {"sign_up": "Sign Up", "username": "ci-classic", "name": "Classic", "pass": "retro",
                                     "email": "classic@example.com", "avatar": "avatar-2.svg", "user": "", "password": ""})
          fan.go("/buy/?id=3")
          status, _, body, _ = fan.go("/cart/")
          expect(status == 200 and "Delete item" in body and "Pay:" in body, "/cart/ in the classic design")
          status, _, body, _ = fan.go("/products/")
          expect("Add to cart" in body, "/products/ in the classic design: no Add to cart for a customer")
          fan.go("/theme", "POST", {"theme": "new", "next": "/products/"})
          status, _, body, _ = fan.go("/products/")
          expect("modern.css" in body and "Grab it" in body, "switching back to the new design did not take")
          status, location, _, _ = fan.go("/theme", "POST", {"theme": "new", "next": "//evil.example/"})
          expect(location.endswith("/scamazon/products/"), f"/theme to another site: {location}")

          # The dark patterns: marked on the pages, revealed on request, the pre-ticked add-on on the order
          for key in ["countdown", "viewers", "anchor"]:
              expect(f'data-trick="{key}"' in body, f"/products/: the {key} trick is not marked")
          status, _, body, _ = fan.go("/cart/")
          expect('data-trick="preselected"' in body and 'name="protection" id="protection" checked' in body,
                 "/cart/: no pre-ticked add-on")
          fan.go("/tricks", "POST", {"next": "/cart/"})
          status, _, body, _ = fan.go("/cart/")
          expect('class="reveal"' in body and "trick-panel" in body and "Hide the tricks" in body, "/cart/: Reveal the tricks did not take")
          status, _, body, _ = fan.go("/payment", "POST", {"protection": "on"})
          expect(status == 200, f"/payment with the add-on: {status}")
          status, _, body, _ = anon.go("/tricks/")
          expect(status == 200 and "False urgency" in body and "Confirmshaming" in body, f"/tricks/: {status}")

          # Another visitor is not the shopper (the old code had one shared user for everyone)
          status, _, body, _ = anon.go("/about/")
          expect("ci-shopper" not in body, "a visitor who is not logged in sees the shopper's name")

          # The public demo account: named on the login page, logs in as a customer, is not admin
          status, _, body, _ = anon.go("/login/")
          expect("Log in as <strong>demo</strong>" in body, "/login/: the demo account is not named")
          expect(body.count('name="avatar"') == 8, "/login/: not eight avatars to pick from")
          demo = Visitor()
          demo.go("/login/", "POST", {"sign_in": "Sign In", "user": "demo", "password": "demo"})
          status, _, body, _ = demo.go("/cart/")
          expect(status == 200, f"/cart/ as demo: {status}")
          status, _, body, _ = demo.go("/about/")
          expect("/scamazon/static/avatars/avatar-4.svg" in body, "demo: not its avatar")
          status, location, _, _ = demo.go("/admin-product/")
          expect(status == 302 and location.endswith("/scamazon/admin-login/"), f"/admin-product/ as demo: {status} {location}")
          # The demo account keeps its password and cannot be deleted
          demo.go("/account/password", "POST", {"current": "demo", "new": "taken", "repeat": "taken"})
          demo.go("/account/delete", "POST", {"password": "demo"})
          relogin = Visitor()
          relogin.go("/login/", "POST", {"sign_in": "Sign In", "user": "demo", "password": "demo"})
          expect(relogin.go("/cart/")[0] == 200, "the demo account's password changed, or the account is gone")

          # The account page: avatar, password, deleting the account
          owner = Visitor()
          owner.go("/login/", "POST", {"sign_up": "Sign Up", "username": "ci-owner", "name": "Owner", "pass": "first",
                                       "email": "owner@example.com", "avatar": "avatar-1.svg", "user": "", "password": ""})
          status, _, body, _ = owner.go("/account/")
          expect(status == 200 and "ci-owner" in body and "Delete my account" in body, f"/account/: {status}")
          owner.go("/buy/?id=2")  # a cart row that deleting the account must take along
          owner.go("/account/profile", "POST", {"avatar": "avatar-7.svg", "name": "Owner Two", "email": "owner@example.com"})
          status, _, body, _ = owner.go("/account/")
          expect('value="avatar-7.svg" checked' in body and "Owner Two" in body, "/account/profile: avatar or name not saved")
          status, location, _, _ = owner.go("/account/password", "POST", {"current": "first", "new": "second", "repeat": "second"})
          expect("Password+changed" in location, f"/account/password: {location}")
          old = Visitor()
          old.go("/login/", "POST", {"sign_in": "Sign In", "user": "ci-owner", "password": "first"})
          expect(old.go("/cart/")[0] == 302, "the old password still logs in")
          status, location, _, _ = owner.go("/account/delete", "POST", {"password": "wrong"})
          expect("account+is+kept" in location, f"/account/delete with a wrong password: {location}")
          status, location, _, _ = owner.go("/account/delete", "POST", {"password": "second"})
          expect(location.endswith("/scamazon/login/"), f"/account/delete: {status} {location}")
          gone = Visitor()
          gone.go("/login/", "POST", {"sign_in": "Sign In", "user": "ci-owner", "password": "second"})
          expect(gone.go("/cart/")[0] == 302, "the deleted account still logs in")

          if failures:
              raise SystemExit("\n".join(failures))
          print("all checks passed")
          EOF

      - name: Check the stored accounts
        run: |
          # As a file, not on stdin: mongosh reading stdin is a prompt that prints an error and
          # goes on (exit 0); with --file an error stops it and fails the step.
          docker compose -f docker-compose.prod.yml exec -T mongo-database-service \
            sh -c 'cat > /tmp/check.js && mongosh --quiet -u root -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin allUsers --file /tmp/check.js' <<'EOF'
          const u = db.users.findOne({ username: "ci-shopper" });
          if (!u) throw new Error("ci-shopper was not stored");
          if (u.role !== "customer") throw new Error(`ci-shopper has role ${u.role}`);
          if (!/^(pbkdf2|scrypt):/.test(u.password)) throw new Error("ci-shopper's password is not hashed");
          const admins = db.users.countDocuments({ role: { $ne: "customer" } });
          if (admins) throw new Error(`${admins} accounts are not customers`);
          const plain = db.users.countDocuments({ password: { $type: "string", $not: /^(pbkdf2|scrypt):/ } });
          if (plain) throw new Error(`${plain} accounts have a plaintext password`);
          // Their passwords are public in init/03-init-users.js, so they must have none (no login)
          const demo = ["emclinden0", "tjewar1", "sgwyneth5", "akamen2", "cmor3", "rporker4", "admin", "user1"];
          const withPassword = db.users.countDocuments({ username: { $in: demo }, password: { $exists: true } });
          if (withPassword) throw new Error(`${withPassword} demo accounts still have a password`);
          const shared = db.users.findOne({ username: "demo" });
          if (db.users.findOne({ username: "ci-owner" })) throw new Error("ci-owner was deleted but is still stored");
          // The shopper paid in kronor: the order keeps euro and what they saw
          const shopperId = db.users.findOne({ username: "ci-shopper" }).id;
          const order = db.getSiblingDB("allProducts").orders.findOne({ userid: shopperId });
          if (!order || order.currency !== "SEK" || !order.rate || !order.price_in_currency || typeof order.price !== "number")
            throw new Error(`the shopper's order: ${JSON.stringify(order)}`);
          print(`order: ${order.price} EUR = ${order.price_in_currency} SEK at ${order.rate}`);
          // The classic-then-new customer paid with the pre-ticked add-on left on: it is on the order
          const fanId = db.users.findOne({ username: "ci-classic" }).id;
          const fanOrder = db.getSiblingDB("allProducts").orders.findOne({ userid: fanId });
          if (!fanOrder || !fanOrder.extras || fanOrder.extras.length !== 1 || fanOrder.extras[0].name !== "Scam Protection Plus")
            throw new Error(`ci-classic's order has no add-on: ${JSON.stringify(fanOrder && fanOrder.extras)}`);
          if (Math.abs(fanOrder.price - fanOrder.history.reduce((sum, p) => sum + Number(p.price), 0) - 4.99) > 0.001)
            throw new Error(`ci-classic's order total is not the items plus 4.99: ${fanOrder.price}`);
          print(`add-on order: ${fanOrder.price} EUR with ${fanOrder.extras[0].name}`);
          // Paid carts are emptied, and a deleted account leaves no cart rows behind
          // order-processing keeps orders and carts in allProducts (init/02 seeds an unused allOrders)
          const carts = db.getSiblingDB("allProducts").cart;
          if (carts.countDocuments({ userid: shopperId })) throw new Error("the shopper's cart was not emptied after paying");
          const userIds = db.users.distinct("id");
          const orphans = carts.countDocuments({ userid: { $nin: userIds } });
          if (orphans) throw new Error(`${orphans} cart rows belong to no account (deleted account's cart left behind)`);
          if (!shared || shared.role !== "customer" || !/^(pbkdf2|scrypt):/.test(shared.password)) throw new Error("the demo account is missing, not a customer or its password is not hashed");
          print("accounts: all customers, every password hashed, demo accounts without a password, the public demo account in place");
          EOF

      - name: Logs
        if: always()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 50
